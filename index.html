<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>كل عام وانتي بخير يا ريري</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- الصوتيات -->
  <audio id="bg-music" src="song.mp3" loop></audio>
  <audio id="chest-sound" src="chest-open.mp3"></audio>

  <div class="page-container">
    
    <!-- العنوان فوق في المنتصف -->
    <h1 class="main-title">كل عام وانتي بخير ياريري 🥳🩷</h1>

    <!-- الشخصيات في المنتصف ملامسة للعشب -->
    <div class="characters-box">
      <img src="all.png" alt="الشخصيات" class="waving-characters">
    </div>

    <!-- الصندوق أسفل الشخصيات في المنتصف -->
    <div class="chest-box" id="chest-container">
      <div class="message-card" id="message-card">
        <img src="word.png" alt="الرسالة">
      </div>
      <img src="close.png" alt="صندوق مغلق" id="chest-img" class="chest-image">
      <p class="chest-hint" id="chest-hint">اضغطي على الصندوق 🎁</p>
    </div>

  </div>

  <script>
    const bgMusic = document.getElementById('bg-music');
    const chestSound = document.getElementById('chest-sound');
    const chestContainer = document.getElementById('chest-container');
    const chestImg = document.getElementById('chest-img');
    const messageCard = document.getElementById('message-card');
    const chestHint = document.getElementById('chest-hint');

    let isOpened = false;

    // خفض صوت أغنية الخلفية إلى 50%
    bgMusic.volume = 0.5;

    // دالة لتشغيل الموسيقى فور تحميل الصفحة أو عند أول لمسة للفيلم
    function playAudio() {
      bgMusic.play().then(() => {
        window.removeEventListener('click', playAudio);
        window.removeEventListener('touchstart', playAudio);
      }).catch(err => {
        console.log("في انتظار التفاعل لتشغيل الصوت");
      });
    }

    // تشغيل مباشر فور تحميل الصفحة واحتياطياً عند لمس الشاشة
    window.addEventListener('load', playAudio);
    window.addEventListener('click', playAudio);
    window.addEventListener('touchstart', playAudio);

    // فتح الصندوق وتغيير الصورة وإظهار الرسالة
    chestContainer.addEventListener('click', () => {
      if (!isOpened) {
        chestSound.currentTime = 0;
        chestSound.play().catch(err => console.log(err));

        chestImg.src = 'open.png';
        messageCard.classList.add('open');
        chestHint.style.opacity = '0';

        isOpened = true;
      }
    });
  </script>
</body>
</html>
